server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: https://loki.local/loki/api/v1/push
    tls_config:
      insecure_skip_verify: true  # Bypass la validation SSL

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log  # Chemin vers vos logs
  
  - job_name: app1
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log  # Chemin vers vos logs

  - job_name: docker
    docker_sd_configs:
      - host: "unix:///var/run/docker.sock"
        refresh_interval: 5s  # Rafraîchit la liste des conteneurs toutes les 5 secondes
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'  # stdout ou stderr
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'  # Nom du service dans docker-compose
    pipeline_stages:
      - docker: {}  # Parse les logs Docker (ajoute des labels comme `filename`, `tag`, etc.)